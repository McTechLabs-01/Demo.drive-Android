name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install SDK packages
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "Using $SM"
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SM" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0"
          echo "sdk.dir=$SDK" > local.properties
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.13 }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: demodrive-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
